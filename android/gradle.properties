org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable configuration cache ? prevents metadata.bin corruption with Gradle 8.x
org.gradle.configuration-cache=false
# Disable parallel builds to avoid cache race conditions
org.gradle.parallel=false
