name: meditrack
description: "MediTrack – One App to Remember, Record & Revive"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0

  # Auth
  google_sign_in: ^6.2.2
  local_auth: ^2.3.0

  # Secure Storage
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Notifications
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.3

  # Connectivity & Caching
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2

  # PDF & Sharing
  pdf: ^3.11.3
  printing: ^5.13.2
  share_plus: ^10.1.2
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^0.69.0

  # Localization
  easy_localization: ^3.0.7

  # OCR & Image
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0

  # Utilities
  intl: 0.20.2
  provider: ^6.1.2
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/config.json
